name: Publish TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chitram-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing setup
        id: signing
        env:
          KEYSTORE: ${{ secrets.CHITRAM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CHITRAM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHITRAM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHITRAM_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets are not configured; no APK will be published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        if: steps.signing.outputs.ready == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Restore signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.CHITRAM_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE" | base64 --decode > signing/release.jks
          chmod 600 signing/release.jks
      - name: Build and test
        if: steps.signing.outputs.ready == 'true'
        env:
          CHITRAM_KEYSTORE_PATH: signing/release.jks
          CHITRAM_STORE_PASSWORD: ${{ secrets.CHITRAM_STORE_PASSWORD }}
          CHITRAM_KEY_ALIAS: ${{ secrets.CHITRAM_KEY_ALIAS }}
          CHITRAM_KEY_PASSWORD: ${{ secrets.CHITRAM_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease -PchitramVersionCode=$((GITHUB_RUN_NUMBER + 1)) -PchitramVersionName=0.1.$((GITHUB_RUN_NUMBER + 1))
      - name: Publish release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$((GITHUB_RUN_NUMBER + 1))
          gh release create "v$code" "app/build/outputs/apk/release/app-release.apk#chitram-tv.apk" --title "Chitram v$code" --notes "Android TV update for this commit. Playback availability remains experimental." --latest
